<script>
/* ==========================================================================
   AdminForms.html — form helpers and the add/edit/review drawers.
   ========================================================================== */
(function () {
  'use strict';
  var html = UI.html, raw = UI.raw, icon = UI.icon, $ = UI.$, $$ = UI.$$, setHtml = UI.setHtml;
  var F = window.AdminForms;
  var uid = 0;

  // ------------------------------------------------------------------ Field builders
  function attrs(o) {
    var a = [];
    if (o.required) a.push('required');
    if (o.max) a.push('maxlength="' + Number(o.max) + '"');
    if (o.placeholder) a.push('placeholder="' + UI.esc(o.placeholder) + '"');
    if (o.dir) a.push('dir="' + UI.esc(o.dir) + '"');
    if (o.list) a.push('list="' + UI.esc(o.list) + '"');
    if (o.inputmode) a.push('inputmode="' + UI.esc(o.inputmode) + '"');
    if (o.autocomplete) a.push('autocomplete="' + UI.esc(o.autocomplete) + '"');
    if (o.readonly) a.push('readonly');
    if (o.disabled) a.push('disabled');
    if (o.autofocus) a.push('autofocus');
    if (o.min !== undefined) a.push('min="' + Number(o.min) + '"');
    if (o.step !== undefined) a.push('step="' + Number(o.step) + '"');
    return raw(a.join(' '));
  }
  function labelHtml(id, label, o) {
    return html`<label class="label" for="${id}">${label}${o.optional ? html` <span class="opt">(optional)</span>` : ''}</label>`;
  }
  F.input = function (name, label, value, o) {
    o = o || {}; var id = 'f-' + name + '-' + (++uid);
    return html`<div class="field ${o.hidden ? 'hidden' : ''}" data-field="${name}">${labelHtml(id, label, o)}
      <input class="input" id="${id}" name="${name}" type="${o.type || 'text'}" value="${value === null || value === undefined ? '' : value}" ${attrs(o)}>
      ${o.hint ? html`<p class="hint">${o.hint}</p>` : ''}</div>`;
  };
  F.textarea = function (name, label, value, o) {
    o = o || {}; var id = 'f-' + name + '-' + (++uid);
    return html`<div class="field ${o.hidden ? 'hidden' : ''}" data-field="${name}">${labelHtml(id, label, o)}
      <textarea class="textarea" id="${id}" name="${name}" ${attrs(o)} style="${o.rows ? 'min-height:' + (o.rows * 26) + 'px' : ''}">${value || ''}</textarea>
      ${o.hint ? html`<p class="hint">${o.hint}</p>` : ''}</div>`;
  };
  F.select = function (name, label, value, options, o) {
    o = o || {}; var id = 'f-' + name + '-' + (++uid);
    return html`<div class="field ${o.hidden ? 'hidden' : ''}" data-field="${name}">${labelHtml(id, label, o)}
      <select class="select" id="${id}" name="${name}" ${attrs(o)}>
        ${options.map(function (op) { return html`<option value="${op.v}" ${String(op.v) === String(value) ? 'selected' : ''} ${op.disabled ? 'disabled' : ''}>${op.l}</option>`; })}
      </select>${o.hint ? html`<p class="hint">${o.hint}</p>` : ''}</div>`;
  };
  F.toggle = function (name, label, checked, hint, disabled) {
    return html`<div class="field" data-field="${name}"><label class="switch">
      <span><span class="label" style="display:block">${label}</span>${hint ? html`<span class="hint">${hint}</span>` : ''}</span>
      <input type="checkbox" name="${name}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}><span class="track" aria-hidden="true"></span></label></div>`;
  };

  F.read = function (form) {
    var out = {};
    $$('input[name], select[name], textarea[name]', form).forEach(function (el) {
      if (el.closest('.hidden') && el.type !== 'hidden') { out[el.name] = el.type === 'checkbox' ? false : ''; return; }
      out[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  };
  F.clearErrors = function (form) {
    $$('.field-error', form).forEach(function (e) { e.remove(); });
    $$('[aria-invalid]', form).forEach(function (e) { e.removeAttribute('aria-invalid'); });
    var fe = $('[data-form-error]', form); if (fe) setHtml(fe, '');
  };
  F.showError = function (form, err) {
    var el = err.field ? $('[name="' + err.field + '"]', form) : null;
    if (el && !el.closest('.hidden')) {
      el.setAttribute('aria-invalid', 'true');
      var p = document.createElement('p'); p.className = 'field-error'; p.textContent = err.message;
      el.closest('.field').appendChild(p);
      el.focus();
    } else {
      var fe = $('[data-form-error]', form);
      if (fe) setHtml(fe, html`<div class="notice notice-danger" role="alert" style="margin-bottom:16px">${icon('alert')}<span>${err.message}</span></div>`);
      else UI.toast(err.message, 'error');
    }
  };

  /** Opens a drawer containing a form and wires Save / Enter to onSave(values, done). */
  F.formDrawer = function (opts) {
    var formId = 'form-' + (++uid);
    var sheet = UI.openSheet({
      title: opts.title, drawer: true,
      body: html`<form id="${formId}" novalidate><div data-form-error></div>${opts.fields}</form>`,
      footer: html`${opts.extraFooter || ''}<span style="flex:1"></span>
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" form="${formId}" data-save>${opts.saveLabel || 'Save'}</button>`
    });
    var form = $('#' + formId, sheet.el);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = $('[data-save]', sheet.el);
      F.clearErrors(form);
      UI.setBusy(btn, true, 'Saving…');
      Promise.resolve(opts.onSave(F.read(form), form)).then(function (msg) {
        sheet.close(); if (msg) UI.toast(msg); AdminApp.ctx.renderPage();
      }).catch(function (err) { UI.setBusy(btn, false); F.showError(form, err); });
    });
    if (opts.onMount) opts.onMount(sheet, form);
    return sheet;
  };

  function confirmThen(opts, fn) {
    return UI.confirmDialog(opts).then(function (ok) { if (ok) return fn(); });
  }
  F.confirmThen = confirmThen;

  // ------------------------------------------------------------------ Option lists
  function programmeOptions(ctx, includeNone, noneLabel) {
    var list = ctx.S.data.programmes.slice().sort(function (a, b) { return (a.sort_order - b.sort_order) || a.name.localeCompare(b.name); });
    var out = includeNone ? [{ v: '', l: noneLabel || '— None —' }] : [{ v: '', l: 'Choose a programme…' }];
    return out.concat(list.map(function (p) { return { v: p.id, l: p.name + (p.is_active ? '' : ' (inactive)') }; }));
  }
  function categoryOptions(ctx) {
    return [{ v: '', l: '— General (no collection) —' }].concat(ctx.S.data.categories.slice()
      .sort(function (a, b) { return a.sort_order - b.sort_order; })
      .map(function (c) { return { v: c.id, l: c.name + (c.is_active ? '' : ' (inactive)') }; }));
  }
  function platformOptions(ctx, current) {
    var list = ctx.S.data.platforms.slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
    var opts = list.filter(function (p) { return p.is_active || p.name === current; }).map(function (p) { return { v: p.name, l: p.name + (p.is_active ? '' : ' (inactive)') }; });
    if (current && !opts.some(function (o) { return o.v === current; })) opts.unshift({ v: current, l: current + ' (deleted)' });
    return opts;
  }
  F.programmeOptions = programmeOptions;

  function resourceFields(ctx, r, o) {
    o = o || {};
    var official = !!r.is_official;
    return html`
      ${F.select('is_official', 'Type', official ? 'true' : 'false', [{ v: 'false', l: 'Student resource' }, { v: 'true', l: 'Official UniMAP link' }], { hint: 'Official links point to UniMAP’s own websites and appear in the Official section.' })}
      ${F.input('title', 'Title', r.title, { required: true, max: 180 })}
      <div class="row-2 field-row">
        ${F.input('owner_name', 'Owner name', r.owner_name, { required: true, max: 140 })}
        ${F.input('intake', 'Intake', r.intake, { max: 40, list: 'intake-options', hint: official ? 'Leave empty for "Official".' : 'e.g. 2023' })}
      </div>
      <datalist id="intake-options">${intakeSuggestions(ctx)}</datalist>
      ${F.select('programme_id', 'Programme', r.programme_id || '', programmeOptions(ctx, official, '— None (official link only) —'), { hint: official ? 'Optional for official links: also show it on a programme page.' : 'Required for student resources.' })}
      ${F.select('category_id', 'Official collection', r.category_id || '', categoryOptions(ctx), { hidden: !official })}
      ${F.select('platform', 'Platform', r.platform || (ctx.S.data.platforms[0] || {}).name, platformOptions(ctx, r.platform))}
      ${F.input('url', 'Link (URL)', r.url, { required: true, type: 'url', dir: 'ltr', max: 2048, placeholder: 'https://', inputmode: 'url' })}
      ${F.textarea('notes', 'Notes', r.notes, { max: 1000, optional: true, dir: 'auto' })}
      ${o.withMeta ? html`<div class="row-2 field-row">
        ${F.input('sort_order', 'Sort order', r.sort_order || 0, { type: 'number', step: 1, hint: 'Lower numbers appear first.' })}
        <div class="field">${F.toggle('is_active', 'Visible on the public site', r.is_active !== false)}</div>
      </div>` : ''}`;
  }
  function intakeSuggestions(ctx) {
    var seen = {};
    ctx.S.data.resources.forEach(function (r) { if (r.intake) seen[r.intake] = 1; });
    return Object.keys(seen).sort().reverse().slice(0, 30).map(function (i) { return html`<option value="${i}">`; });
  }
  function wireResourceType(form) {
    var type = $('[name="is_official"]', form);
    function sync() {
      var off = type.value === 'true';
      $('[data-field="category_id"]', form).classList.toggle('hidden', !off);
      var hint = $('[data-field="programme_id"] .hint', form);
      if (hint) hint.textContent = off ? 'Optional for official links: also show it on a programme page.' : 'Required for student resources.';
      var none = $('[name="programme_id"] option[value=""]', form);
      if (none) none.textContent = off ? '— None (official link only) —' : 'Choose a programme…';
    }
    type.addEventListener('change', sync); sync();
  }

  // ------------------------------------------------------------------ Resources
  F.openResourceForm = function (ctx, r, preset) {
    var isNew = !r;
    r = r || Object.assign({ is_active: true, is_official: false, sort_order: 0 }, preset || {});
    var sheet = F.formDrawer({
      title: isNew ? 'Add resource' : 'Edit resource',
      fields: resourceFields(ctx, r, { withMeta: true }),
      saveLabel: isNew ? 'Add resource' : 'Save changes',
      extraFooter: isNew ? '' : html`<button type="button" class="btn btn-danger-ghost" data-del>${icon('trash', 'icon-sm')}Delete</button>`,
      onSave: function (v) {
        v.is_official = v.is_official === 'true';
        if (!isNew) v.id = r.id;
        return ctx.call('resources.save', v).then(function () { return isNew ? 'Resource added' : 'Resource saved'; });
      },
      onMount: function (s, form) {
        wireResourceType(form);
        var del = $('[data-del]', s.el);
        if (del) del.onclick = function () {
          confirmThen({ title: 'Delete this resource?', message: '“' + r.title + '” will be removed permanently. You can deactivate it instead to hide it temporarily.', confirmText: 'Delete', danger: true },
            function () { return ctx.call('resources.delete', { id: r.id }).then(function () { s.close(); UI.toast('Resource deleted'); ctx.renderPage(); }).catch(function (e) { UI.toast(e.message, 'error'); }); });
        };
      }
    });
    return sheet;
  };

  // ------------------------------------------------------------------ Programmes
  F.openProgrammeForm = function (ctx, p) {
    var isNew = !p;
    p = p || { is_active: true };
    var faculties = {};
    ctx.S.data.programmes.forEach(function (x) { if (x.faculty) faculties[x.faculty] = 1; });
    return F.formDrawer({
      title: isNew ? 'Add programme' : 'Edit programme',
      saveLabel: isNew ? 'Add programme' : 'Save changes',
      fields: html`
        ${F.input('name', 'Programme name (English)', p.name, { required: true, max: 160, placeholder: 'Bachelor of … Engineering with Honours' })}
        ${F.input('name_ar', 'Programme name (Arabic)', p.name_ar, { max: 160, dir: 'rtl', optional: true })}
        <div class="row-2 field-row">
          ${F.input('code', 'Programme code', p.code, { max: 24, optional: true, placeholder: 'e.g. RK20' })}
          ${F.input('faculty', 'Faculty', p.faculty, { max: 160, list: 'faculty-options', optional: true, placeholder: 'e.g. FKTE' })}
        </div>
        <datalist id="faculty-options">${Object.keys(faculties).map(function (f) { return html`<option value="${f}">`; })}</datalist>
        ${F.textarea('description', 'Description (English)', p.description, { max: 1200, optional: true })}
        ${F.textarea('description_ar', 'Description (Arabic)', p.description_ar, { max: 1200, optional: true, dir: 'rtl' })}
        ${F.input('slug', 'URL name', p.slug, { max: 120, dir: 'ltr', optional: true, hint: 'Used in the page link (…?p=programme&s=url-name). Leave empty to generate from the name.' })}
        ${F.toggle('is_active', 'Visible on the public site', p.is_active !== false, 'Inactive programmes and their resources are hidden from students.')}`,
      onSave: function (v) {
        if (!isNew) v.id = p.id;
        return ctx.call('programmes.save', v).then(function () { return isNew ? 'Programme added' : 'Programme saved'; });
      }
    });
  };

  // ------------------------------------------------------------------ Collections
  F.openCollectionForm = function (ctx, c) {
    var isNew = !c;
    c = c || { is_active: true };
    return F.formDrawer({
      title: isNew ? 'Add official collection' : 'Edit collection',
      saveLabel: isNew ? 'Add collection' : 'Save changes',
      fields: html`
        <div class="notice" style="margin-bottom:16px">${icon('info')}<span>Collections group official UniMAP links (for example “Class Timetable”). Add links to a collection from Resources → Official link.</span></div>
        ${F.input('name', 'Name (English)', c.name, { required: true, max: 120 })}
        ${F.input('name_ar', 'Name (Arabic)', c.name_ar, { max: 120, dir: 'rtl', optional: true })}
        ${F.textarea('description', 'Description (English)', c.description, { max: 800, optional: true })}
        ${F.textarea('description_ar', 'Description (Arabic)', c.description_ar, { max: 800, optional: true, dir: 'rtl' })}
        ${F.input('slug', 'URL name', c.slug, { max: 120, dir: 'ltr', optional: true, hint: 'Leave empty to generate from the name.' })}
        ${F.toggle('is_active', 'Visible on the public site', c.is_active !== false)}`,
      onSave: function (v) {
        if (!isNew) v.id = c.id;
        return ctx.call('categories.save', v).then(function () { return isNew ? 'Collection added' : 'Collection saved'; });
      }
    });
  };

  // ------------------------------------------------------------------ Platforms
  F.openPlatformForm = function (ctx, p) {
    var isNew = !p;
    p = p || { is_active: true };
    return F.formDrawer({
      title: isNew ? 'Add platform' : 'Edit platform',
      saveLabel: isNew ? 'Add platform' : 'Save changes',
      fields: html`
        ${F.input('name', 'Platform name', p.name, { required: true, max: 40, placeholder: 'e.g. Dropbox', hint: isNew ? '' : 'Renaming updates every resource and submission that uses this platform.' })}
        ${F.toggle('is_active', 'Available in forms', p.is_active !== false, 'Inactive platforms stay on existing resources but cannot be chosen for new ones.')}`,
      onSave: function (v) {
        if (!isNew) v.id = p.id;
        return ctx.call('platforms.save', v).then(function () { return isNew ? 'Platform added' : 'Platform saved'; });
      }
    });
  };

  // ------------------------------------------------------------------ Admins
  F.showTempPassword = function (email, temp, isNew) {
    var s = UI.openSheet({
      title: isNew ? 'Admin created' : 'Password reset', size: 'sm', persistent: true,
      body: html`<p class="muted">Give this temporary password to <strong>${email}</strong> privately (not in a public group). They must choose a new password when they first sign in.</p>
        <div class="temp-pass" style="margin-top:16px">${temp}</div>
        <p class="hint" style="margin-top:10px">This password is shown only once and is not stored anywhere in readable form.</p>`,
      footer: html`<button type="button" class="btn btn-secondary" data-copy>${icon('copy', 'icon-sm')}Copy</button><button type="button" class="btn btn-primary" data-close>Done</button>`
    });
    $('[data-copy]', s.el).onclick = function () { UI.copyText(temp).then(function (ok) { UI.toast(ok ? 'Copied' : 'Copy failed — select the text manually', ok ? 'ok' : 'error'); }); };
  };

  F.openAdminForm = function (ctx, a) {
    var isNew = !a;
    a = a || { role: 'admin', is_active: true };
    var self = !isNew && a.id === ctx.S.me.id;
    return F.formDrawer({
      title: isNew ? 'Add admin' : 'Edit admin',
      saveLabel: isNew ? 'Create admin' : 'Save changes',
      fields: html`
        ${F.input('name', 'Name', a.name, { required: true, max: 120 })}
        ${isNew ? F.input('email', 'Email', '', { required: true, type: 'email', dir: 'ltr', max: 160, autocomplete: 'off', hint: 'Used to sign in. A temporary password will be generated.' })
                : html`<div class="field"><span class="label">Email</span><p class="ltr">${a.email}</p></div>`}
        ${F.select('role', 'Role', a.role, [
          { v: 'reviewer', l: 'Reviewer — review submissions only' },
          { v: 'admin', l: 'Admin — manage all content' },
          { v: 'owner', l: 'Owner — everything, including admins & security' }
        ], { disabled: self, hint: self ? 'You cannot change your own role.' : '' })}
        ${F.toggle('is_active', 'Account active', a.is_active !== false, self ? 'You cannot deactivate yourself.' : 'Inactive admins are signed out immediately and cannot sign in.', self)}`,
      onSave: function (v) {
        if (!isNew) v.id = a.id;
        if (self) { v.role = a.role; v.is_active = true; }
        return ctx.call('admins.save', v).then(function (d) {
          if (d && d.temp_password) setTimeout(function () { F.showTempPassword(v.email, d.temp_password, true); }, 50);
          return isNew ? 'Admin created' : 'Admin saved';
        });
      }
    });
  };

  // ------------------------------------------------------------------ Password change
  F.passwordFields = function () {
    return html`
      ${F.input('current_password', 'Current password', '', { type: 'password', required: true, autocomplete: 'current-password' })}
      ${F.input('new_password', 'New password', '', { type: 'password', required: true, autocomplete: 'new-password', hint: 'At least 10 characters, with letters and numbers.' })}
      ${F.input('confirm_password', 'Confirm new password', '', { type: 'password', required: true, autocomplete: 'new-password' })}`;
  };
  F.submitPasswordChange = function (ctx, form, done) {
    F.clearErrors(form);
    var v = F.read(form);
    var errBox = $('#pw-error', form) || $('[data-form-error]', form);
    if (v.new_password !== v.confirm_password) { F.showError(form, { field: 'confirm_password', message: 'Passwords do not match.' }); return; }
    if (String(v.new_password).length < 10) { F.showError(form, { field: 'new_password', message: 'Password must be at least 10 characters.' }); return; }
    var btn = $('button[type="submit"]', form) || $('[data-save]', form);
    UI.setBusy(btn, true, 'Saving…');
    ctx.call('account.changePassword', { current_password: v.current_password, new_password: v.new_password }).then(function (d) {
      if (d && d.token) { ctx.S.token = d.token; UI.session.set('urh_admin_token', d.token); }
      if (d && d.admin) ctx.S.me = d.admin;
      UI.toast('Password updated');
      done && done();
    }).catch(function (e) {
      UI.setBusy(btn, false);
      if (errBox && !e.field) setHtml(errBox, html`<div class="notice notice-danger" role="alert" style="margin-top:16px">${icon('alert')}<span>${e.message}</span></div>`);
      else F.showError(form, e);
    });
  };

  // ------------------------------------------------------------------ Submission review
  function defaultTitle(sub) {
    if (sub.resource_type === 'official') return sub.full_name + ' — Official link';
    return sub.full_name + ' ' + (sub.platform === 'Google Drive' ? 'Drive' : sub.platform);
  }

  F.openSubmissionReview = function (ctx, sub) {
    var S = ctx.S;
    var pending = sub.status === 'pending';
    var official = sub.resource_type === 'official';
    var dupRes = S.data.resources.filter(function (r) { return r.url_key && r.url_key === sub.url_key; });
    var dupSub = S.data.submissions.filter(function (s) { return s.id !== sub.id && s.url_key === sub.url_key; });
    var prog = ctx.byId(S.data.programmes, sub.programme_id);
    var formId = 'review-' + (++uid);
    var canAdmin = ctx.can('admin');
    var resource = sub.resource_id ? ctx.byId(S.data.resources, sub.resource_id) : null;

    var statusBadge = sub.status === 'pending' ? html`<span class="badge badge-warn">Pending</span>`
      : sub.status === 'approved' ? html`<span class="badge badge-ok">Approved</span>` : html`<span class="badge badge-danger">Rejected</span>`;

    var body = html`
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${statusBadge}<span class="badge badge-outline">${official ? 'Official link' : 'Student resource'}</span><span class="subtle small">Submitted ${UI.fmtDate(sub.submitted_at, 'en', true)}</span></div>
      <dl class="kv" style="margin-top:16px">
        <dt>Name</dt><dd dir="auto">${sub.full_name}</dd>
        ${!official ? html`<dt>Programme</dt><dd>${prog ? prog.name : html`<span class="badge badge-danger">Programme deleted</span>`}${prog && !prog.is_active ? html` <span class="badge">inactive</span>` : ''}</dd>
        <dt>Intake</dt><dd>${sub.intake}</dd>` : ''}
        <dt>Platform</dt><dd>${sub.platform}</dd>
        <dt>Link</dt><dd><a href="${UI.safeUrl(sub.resource_url)}" target="_blank" rel="noopener noreferrer" class="ltr break">${sub.resource_url}</a></dd>
        <dt>Notes</dt><dd dir="auto" style="white-space:pre-line">${sub.notes || '—'}</dd>
        ${!pending ? html`<dt>Reviewed</dt><dd>${sub.reviewed_by || '—'} · ${UI.fmtDate(sub.reviewed_at, 'en', true)}</dd>` : ''}
        ${resource ? html`<dt>Resource</dt><dd><a href="#" data-open-resource>${resource.title}</a></dd>` : ''}
      </dl>
      ${dupRes.length || dupSub.length ? html`<div class="notice notice-warn" style="margin-top:16px">${icon('alert')}<div>
        <strong>Possible duplicate</strong>
        ${dupRes.map(function (r) { return html`<div class="small">Already listed: “${r.title}” — ${r.is_official ? 'official' : ctx.progName(r.programme_id)}${r.is_active ? '' : ' (inactive)'}</div>`; })}
        ${dupSub.map(function (s) { return html`<div class="small">Also submitted by ${s.full_name} (${s.status}, ${UI.fmtDate(s.submitted_at, 'en')})</div>`; })}
      </div></div>` : ''}
      <form id="${formId}" novalidate>
        <div data-form-error style="margin-top:16px"></div>
        ${pending ? html`<p class="section-label">Resource that will be published</p>
          <p class="hint" style="margin:-4px 0 14px">Adjust anything before approving — for example a clearer title or the right collection.</p>
          ${resourceFields(ctx, {
            is_official: official, title: defaultTitle(sub), owner_name: official ? 'Universiti Malaysia Perlis' : sub.full_name,
            intake: sub.intake, programme_id: sub.programme_id, category_id: '', platform: sub.platform, url: sub.resource_url, notes: sub.notes
          })}` : ''}
        <p class="section-label">Admin notes</p>
        ${F.textarea('admin_notes', 'Internal notes (not shown publicly)', sub.admin_notes, { max: 1000, optional: true, rows: 3 })}
      </form>`;

    var footer = pending
      ? html`<button type="button" class="btn btn-danger-ghost" data-reject>Reject</button><span style="flex:1"></span>
          <button type="button" class="btn btn-secondary hide-sm" data-close>Close</button>
          <button type="button" class="btn btn-accent" data-approve>${icon('check', 'icon-sm')}Approve & publish</button>`
      : html`${canAdmin ? html`<button type="button" class="btn btn-danger-ghost" data-delete>${icon('trash', 'icon-sm')}Delete</button>` : ''}
          ${canAdmin && sub.status === 'rejected' ? html`<button type="button" class="btn btn-secondary" data-reopen>Move to pending</button>` : ''}
          <span style="flex:1"></span><button type="button" class="btn btn-secondary" data-close>Close</button>
          <button type="button" class="btn btn-primary" data-notes>Save notes</button>`;

    var sheet = UI.openSheet({ title: pending ? 'Review submission' : 'Submission', drawer: true, body: body, footer: footer, noAutoFocus: true });
    var form = $('#' + formId, sheet.el);
    if (pending) wireResourceType(form);

    function run(btn, action, payload, msg) {
      F.clearErrors(form);
      UI.setBusy(btn, true);
      return ctx.call(action, payload).then(function () { sheet.close(); UI.toast(msg); ctx.renderPage(); })
        .catch(function (e) { UI.setBusy(btn, false); F.showError(form, e); });
    }
    var el;
    if ((el = $('[data-approve]', sheet.el))) el.onclick = function () {
      var v = F.read(form);
      var notes = v.admin_notes; delete v.admin_notes;
      v.is_official = v.is_official === 'true';
      run(el, 'submissions.approve', { id: sub.id, resource: v, admin_notes: notes }, 'Approved — resource is now public');
    };
    if ((el = $('[data-reject]', sheet.el))) { var rej = el; rej.onclick = function () {
      var notes = F.read(form).admin_notes;
      confirmThen({ title: 'Reject this submission?', message: notes ? 'Your admin note will be saved with the rejection.' : 'Tip: add an admin note explaining why (optional).', confirmText: 'Reject', danger: true },
        function () { return run(rej, 'submissions.reject', { id: sub.id, admin_notes: notes }, 'Submission rejected'); });
    }; }
    if ((el = $('[data-notes]', sheet.el))) { var nb = el; nb.onclick = function () { run(nb, 'submissions.saveNotes', { id: sub.id, admin_notes: F.read(form).admin_notes }, 'Notes saved'); }; }
    if ((el = $('[data-reopen]', sheet.el))) { var rb = el; rb.onclick = function () { run(rb, 'submissions.reopen', { id: sub.id }, 'Moved back to pending'); }; }
    if ((el = $('[data-delete]', sheet.el))) { var db = el; db.onclick = function () {
      confirmThen({ title: 'Delete this submission record?', message: 'This removes the submission from the history. Published resources are not affected.', confirmText: 'Delete', danger: true },
        function () { return run(db, 'submissions.delete', { id: sub.id }, 'Submission deleted'); });
    }; }
    if ((el = $('[data-open-resource]', sheet.el))) el.onclick = function (e) { e.preventDefault(); sheet.close(); if (ctx.can('admin')) F.openResourceForm(ctx, resource); };
    return sheet;
  };
})();
</script>
